<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サブスク棚 - 実装準備版（JSON連携）</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: #141414;
      --bg-elevated: #1a1a1a;
      --text: #e5e5e5;
      --text-muted: #a0a0a0;
      --accent-red: #e50914;
      --accent-blue: #00a8e1;
      --accent-ps: #0070d1;
      --border: #2a2a2a;
      --card-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    /* Header */
    .shop-header {
      background: #000;
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-link img {
      height: 36px;
      width: auto;
      display: block;
    }
    .shop-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .shop-nav a {
      color: #ccc;
      background: #1f1f1f;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid #333;
      transition: all 0.15s;
    }
    .shop-nav a:hover {
      background: var(--accent-red);
      color: white;
      border-color: var(--accent-red);
    }

    .sample-banner {
      background: #1a2e1a;
      border: 1px solid #2e5a2e;
      color: #a5d6a7;
      padding: 10px 16px;
      margin: 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      text-align: center;
    }

    /* Controls */
    .controls {
      background: var(--bg-card);
      margin: 0 16px 20px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      position: sticky;
      top: 56px;
      z-index: 90;
    }
    .search-row { display: flex; gap: 10px; margin-bottom: 12px; }
    #searchInput {
      flex: 1;
      min-width: 180px;
      padding: 10px 14px;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 1rem;
      background: #111;
      color: var(--text);
    }
    #searchInput::placeholder { color: #666; }
    .filter-group, .sort-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }
    .filter-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      min-width: 70px;
    }
    .filter-btn, .sort-select {
      border: 1px solid #444;
      background: #1f1f1f;
      color: #ddd;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .filter-btn:hover { border-color: #777; }
    .filter-btn.active {
      background: #e5e5e5;
      color: #111;
      border-color: #e5e5e5;
    }
    .sort-select {
      border-radius: 8px;
      padding: 6px 10px;
      background: #1f1f1f;
      color: #ddd;
    }
    .status-line {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Store */
    .store-floor {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 16px 80px;
    }
    .corner {
      margin-bottom: 36px;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .corner-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .corner-netflix .corner-header { background: linear-gradient(90deg, #e50914, #b20710); }
    .corner-prime .corner-header { background: linear-gradient(90deg, #00a8e1, #0077b6); }
    .corner-psplus .corner-header { background: linear-gradient(90deg, #003087, #0070d1); }
    .corner-badge {
      background: rgba(255,255,255,0.2);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    .shelf-row {
      padding: 14px 12px 18px;
      background: #111;
      border-bottom: 1px solid #222;
    }
    .shelf-row:last-child { border-bottom: none; }
    .shelf-label {
      display: inline-block;
      background: #333;
      color: white;
      font-size: 0.78rem;
      padding: 3px 12px;
      border-radius: 4px;
      margin-bottom: 10px;
      margin-left: 6px;
    }
    .shelf-label.popular { background: #e50914; }
    .shelf-label.new { background: #00a86b; }
    .shelf-label.leaving { background: #e74c3c; }

    .shelf-track {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 4px 4px 10px;
      scroll-snap-type: x mandatory;
    }
    .shelf-track::-webkit-scrollbar { height: 6px; }
    .shelf-track::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

    .case {
      flex: 0 0 118px;
      width: 118px;
      scroll-snap-align: start;
      background: #1a1a1a;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: transform 0.2s;
      cursor: pointer;
      position: relative;
      border: 1px solid #2a2a2a;
    }
    .case:hover { transform: translateY(-5px); border-color: #555; }
    .case-cover {
      height: 158px;
      background: #222;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      color: white;
      padding: 8px;
      position: relative;
    }
    .case-title {
      position: relative;
      z-index: 2;
      font-size: 0.72rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.25;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .case-badge {
      position: absolute;
      top: 5px;
      left: 5px;
      z-index: 3;
      font-size: 0.62rem;
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: 700;
      color: white;
    }
    .case-badge.new { background: #00a86b; }
    .case-badge.leaving { background: #e74c3c; }
    .case-meta {
      padding: 5px 4px;
      font-size: 0.65rem;
      color: #aaa;
      background: #151515;
      border-top: 1px solid #2a2a2a;
    }
    .case-meta span {
      display: inline-block;
      background: #2a2a2a;
      padding: 1px 4px;
      border-radius: 3px;
      margin-right: 2px;
      color: #ccc;
    }

    .empty-msg {
      padding: 40px;
      text-align: center;
      color: #666;
    }

    .shop-footer {
      text-align: center;
      padding: 24px 16px;
      color: #666;
      font-size: 0.85rem;
      background: #000;
      border-top: 1px solid #222;
    }

    @media (max-width: 600px) {
      .case { flex: 0 0 100px; width: 100px; }
      .case-cover { height: 135px; }
      .controls { top: 52px; }
      .logo-link img { height: 30px; }
    }
  </style>
</head>
<body>

  <header class="shop-header">
    <a href="#" class="logo-link" onclick="window.scrollTo({top:0,behavior:'smooth'}); return false;" title="ホーム">
      <img src="logo.png" alt="netamapsn">
    </a>
    <nav class="shop-nav">
      <a href="#netflix">Netflix</a>
      <a href="#prime">Amazon</a>
      <a href="#psplus">PS Plus</a>
    </nav>
  </header>

  <div class="sample-banner">
    この版は <strong>JSONデータ連携</strong> の実装準備版です。<br>
    実際の配信データを毎日更新する仕組みのベースになります。検索はタイトル優先で関係ないものが極力出ないように調整しています。
  </div>

  <div class="controls">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="タイトルで検索（関係ないものは極力出ません）">
    </div>

    <div class="filter-group">
      <span class="filter-label">状態：</span>
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="new">新着</button>
      <button class="filter-btn" data-filter="leaving">配信終了間近</button>
    </div>

    <div class="filter-group" id="genreButtons">
      <span class="filter-label">ジャンル：</span>
    </div>

    <div class="sort-group">
      <span class="filter-label">並べ替え：</span>
      <select class="sort-select" id="sortSelect">
        <option value="added_desc">登録順（新しい順）</option>
        <option value="added_asc">登録順（古い順）</option>
        <option value="year_desc">上映年（新しい順）</option>
        <option value="year_asc">上映年（古い順）</option>
        <option value="title">タイトル名</option>
      </select>
    </div>

    <div class="status-line" id="statusLine">読み込み中...</div>
  </div>

  <main class="store-floor" id="storeFloor"></main>

  <footer class="shop-footer">
    サブスク棚 実装準備版<br>
    データは data/titles.json から読み込みます。毎日更新する想定です。
  </footer>

  <script>
    let allData = null;
    let currentFilter = 'all';
    let currentGenre = null;
    let currentPlatform = null;
    let currentSort = 'added_desc';
    let searchQuery = '';

    async function loadData() {
      try {
        const res = await fetch('data/titles.json');
        allData = await res.json();
        buildGenreButtons();
        render();
      } catch (e) {
        document.getElementById('statusLine').textContent = 'データ読み込みに失敗しました';
        console.error(e);
      }
    }

    function buildGenreButtons() {
      const container = document.getElementById('genreButtons');
      const label = container.querySelector('.filter-label');
      container.innerHTML = '';
      if (label) container.appendChild(label);

      const genreSet = new Set();
      const platformSet = new Set();
      Object.values(allData.services).forEach(svc => {
        (svc.genres || []).forEach(g => genreSet.add(g));
        (svc.platforms || []).forEach(p => platformSet.add(p));
        (svc.titles || []).forEach(t => {
          (t.genres || []).forEach(g => genreSet.add(g));
          (t.platforms || []).forEach(p => platformSet.add(p));
        });
      });

      // プラットフォーム（PS4/PS5）を先に出す
      [...platformSet].sort().forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.platform = p;
        btn.textContent = p;
        btn.style.background = '#003087';
        btn.style.color = 'white';
        btn.addEventListener('click', () => {
          if (btn.classList.contains('active')) {
            btn.classList.remove('active');
            currentPlatform = null;
          } else {
            container.querySelectorAll('[data-platform]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPlatform = p;
          }
          render();
        });
        container.appendChild(btn);
      });

      [...genreSet].sort().forEach(g => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.genre = g;
        btn.textContent = g;
        btn.addEventListener('click', () => {
          if (btn.classList.contains('active')) {
            btn.classList.remove('active');
            currentGenre = null;
          } else {
            container.querySelectorAll('[data-genre]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentGenre = g;
          }
          render();
        });
        container.appendChild(btn);
      });
    }

    function getFilteredTitles(serviceKey) {
      const svc = allData.services[serviceKey];
      if (!svc) return [];
      let list = [...svc.titles];

      if (searchQuery) {
        const q = searchQuery.toLowerCase().trim();
        list = list.filter(t => {
          const title = (t.title || '').toLowerCase();
          const original = (t.original_title || '').toLowerCase();
          return title.includes(q) || original.includes(q);
        });
      }

      if (currentFilter === 'new') list = list.filter(t => isNew(t));
      else if (currentFilter === 'leaving') list = list.filter(t => isLeaving(t));

      if (currentGenre) list = list.filter(t => (t.genres || []).includes(currentGenre));
      if (currentPlatform) list = list.filter(t => (t.platforms || []).includes(currentPlatform));

      list.sort((a, b) => {
        if (currentSort === 'added_desc') return (b.added_date || '').localeCompare(a.added_date || '');
        if (currentSort === 'added_asc') return (a.added_date || '').localeCompare(b.added_date || '');
        if (currentSort === 'year_desc') return (b.year || 0) - (a.year || 0);
        if (currentSort === 'year_asc') return (a.year || 0) - (b.year || 0);
        if (currentSort === 'title') return (a.title || '').localeCompare(b.title || '', 'ja');
        return 0;
      });
      return list;
    }

    function isNew(t) {
      if (!t.added_date) return false;
      const added = new Date(t.added_date);
      const now = new Date();
      return (now - added) / (1000 * 60 * 60 * 24) <= 14;
    }

    function isLeaving(t) {
      if (!t.leaving_date) return false;
      const leave = new Date(t.leaving_date);
      const now = new Date();
      const diff = (leave - now) / (1000 * 60 * 60 * 24);
      return diff >= 0 && diff <= 14;
    }

    function daysLeft(t) {
      if (!t.leaving_date) return null;
      return Math.ceil((new Date(t.leaving_date) - new Date()) / (1000 * 60 * 60 * 24));
    }

    function createCase(t) {
      const div = document.createElement('div');
      div.className = 'case';
      div.onclick = () => { if (t.link) window.open(t.link, '_blank'); };

      let badge = '';
      if (isNew(t)) badge = '<div class="case-badge new">NEW</div>';
      else if (isLeaving(t)) {
        const d = daysLeft(t);
        badge = '<div class="case-badge leaving">あと' + d + '日</div>';
      }

      const tags = [];
      (t.platforms || []).forEach(p => tags.push('<span style="background:#003087;color:white;">' + p + '</span>'));
      (t.genres || []).slice(0, 2).forEach(g => tags.push('<span>' + g + '</span>'));
      const genres = tags.join('');
      
      // ポスターURLのプレースホルダーを修正
      let poster = t.poster || '';
      if (poster) {
        poster = poster.replace('{profile}', 's166').replace('{format}', 'jpg');
      }
      
      let coverHtml = '';
      if (poster) {
        coverHtml = '<div class="case-cover" style="background-image:url(\'' + poster + '\'); background-size:cover; background-position:center;"><div class="case-title" style="background:rgba(0,0,0,0.55);padding:4px 2px;border-radius:2px;">' + escapeHtml(t.title) + '</div></div>';
      } else {
        coverHtml = '<div class="case-cover"><div class="case-title">' + escapeHtml(t.title) + '</div></div>';
      }
      
      div.innerHTML = badge + coverHtml + '<div class="case-meta">' + genres + '</div>';
      return div;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderShelf(title, labelClass, titles) {
      if (!titles.length) return '';
      const casesHtml = titles.map(t => createCase(t).outerHTML).join('');
      return '<div class="shelf-row"><div class="shelf-label ' + labelClass + '">' + title + '</div><div class="shelf-track">' + casesHtml + '</div></div>';
    }

    function render() {
      const floor = document.getElementById('storeFloor');
      if (!allData) return;

      let html = '';

      const nf = getFilteredTitles('netflix');
      html += '<section class="corner corner-netflix" id="netflix"><div class="corner-header"><div>Netflixコーナー</div><div class="corner-badge">' + nf.length + '件</div></div>';
      if (nf.length === 0) html += '<div class="empty-msg">該当するタイトルがありません</div>';
      else {
        html += renderShelf('表示中のタイトル', 'popular', nf);
        const news = nf.filter(isNew);
        const leaving = nf.filter(isLeaving);
        if (news.length) html += renderShelf('新着', 'new', news);
        if (leaving.length) html += renderShelf('配信終了間近', 'leaving', leaving);
      }
      html += '</section>';

      const pr = getFilteredTitles('prime');
      html += '<section class="corner corner-prime" id="prime"><div class="corner-header"><div>Amazonプライムコーナー</div><div class="corner-badge">' + pr.length + '件</div></div>';
      if (pr.length === 0) html += '<div class="empty-msg">該当するタイトルがありません</div>';
      else html += renderShelf('表示中のタイトル', 'popular', pr);
      html += '</section>';

      const ps = getFilteredTitles('psplus');
      html += '<section class="corner corner-psplus" id="psplus"><div class="corner-header"><div>PS Plusコーナー</div><div class="corner-badge">' + ps.length + '件</div></div>';
      if (ps.length === 0) html += '<div class="empty-msg">該当するタイトルがありません</div>';
      else html += renderShelf('表示中のタイトル', 'popular', ps);
      html += '</section>';

      floor.innerHTML = html;

      const total = nf.length + pr.length + ps.length;
      let status = '表示中：' + total + '件';
      if (searchQuery) status += ' ／ 検索「' + searchQuery + '」';
      if (currentGenre) status += ' ／ ジャンル「' + currentGenre + '」';
      if (currentPlatform) status += ' ／ 機種「' + currentPlatform + '」';
      if (currentFilter !== 'all') status += ' ／ ' + (currentFilter === 'new' ? '新着' : '終了間近');
      document.getElementById('statusLine').textContent = status + ' ／ 更新: ' + (allData.updated_at || '-');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    document.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      currentSort = e.target.value;
      render();
    });

    loadData();
  </script>
</body>
</html>
