<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>netamapsn - サブスク棚</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: #141414;
      --text: #e8e8e8;
      --text-muted: #999;
      --border: #2a2a2a;
      --accent-red: #e50914;
      --accent-blue: #00a8e1;
      --accent-ps: #0070d1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    /* Header */
    .shop-header {
      background: #000;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-link img { height: 34px; width: auto; display: block; }
    .shop-nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .shop-nav a, .shop-nav button {
      color: #ccc;
      background: #1a1a1a;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.82rem;
      border: 1px solid #333;
      cursor: pointer;
    }
    .shop-nav a:hover, .shop-nav button:hover,
    .shop-nav a.active, .shop-nav button.active {
      background: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
    }
    .shop-nav button.prime.active { background: var(--accent-blue); border-color: var(--accent-blue); }
    .shop-nav button.ps.active { background: var(--accent-ps); border-color: var(--accent-ps); }

    /* Controls */
    .controls {
      background: var(--bg-card);
      margin: 12px 12px 16px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    #searchInput {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 1rem;
      background: #111;
      color: var(--text);
      margin-bottom: 12px;
    }
    #searchInput::placeholder { color: #666; }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .filter-label { font-size: 0.75rem; color: var(--text-muted); min-width: 52px; }
    .filter-btn {
      border: 1px solid #444;
      background: #1f1f1f;
      color: #ddd;
      padding: 5px 11px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .filter-btn.active { background: #eee; color: #111; border-color: #eee; }
    .filter-btn.platform { background: #003087; color: #fff; border-color: #003087; }
    .filter-btn.platform.active { background: #4da3ff; color: #000; }

    /* Genre curtain */
    .genre-curtain {
      border: 1px solid #333;
      border-radius: 8px;
      margin-top: 8px;
      overflow: hidden;
    }
    .genre-toggle {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      background: #1a1a1a;
      color: #ccc;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .genre-toggle:hover { background: #222; }
    .genre-body {
      display: none;
      padding: 10px 12px;
      background: #111;
      border-top: 1px solid #333;
      flex-wrap: wrap;
      gap: 6px;
    }
    .genre-body.open { display: flex; }

    .sort-row { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
    .sort-select {
      background: #1f1f1f;
      color: #ddd;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.85rem;
    }
    .status-line { font-size: 0.78rem; color: var(--text-muted); margin-top: 8px; }

    /* Grid */
    .grid-section {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 12px 60px;
    }
    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 8px 0 14px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title .count {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      background: #222;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .title-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px 12px;
    }
    @media (max-width: 1100px) { .title-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 800px)  { .title-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 520px)  { .title-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

    .card {
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      position: relative;
    }
    .card:hover { transform: translateY(-4px); border-color: #555; }
    .card-poster {
      aspect-ratio: 2/3;
      background: #222 center/cover no-repeat;
      position: relative;
    }
    .card-poster .badge {
      position: absolute;
      top: 6px; left: 6px;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      color: #fff;
    }
    .badge.new { background: #00a86b; }
    .badge.leaving { background: #e74c3c; }
    .card-info {
      padding: 8px 8px 10px;
    }
    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }
    .card-tags span {
      font-size: 0.65rem;
      background: #2a2a2a;
      color: #bbb;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .card-tags span.platform {
      background: #003087;
      color: #fff;
    }

    .empty-msg {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 0.95rem;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 28px 0 10px;
      flex-wrap: wrap;
    }
    .pagination button {
      background: #1f1f1f;
      color: #ddd;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .pagination button:hover:not(:disabled) { background: #333; }
    .pagination button:disabled { opacity: 0.35; cursor: default; }
    .pagination .page-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      min-width: 100px;
      text-align: center;
    }

    .shop-footer {
      text-align: center;
      padding: 20px 12px;
      color: #555;
      font-size: 0.8rem;
      border-top: 1px solid #222;
      background: #000;
    }
  </style>
</head>
<body>

  <header class="shop-header">
    <a href="#" class="logo-link" id="homeBtn" title="ホーム">
      <img src="logo.png" alt="netamapsn">
    </a>
    <nav class="shop-nav" id="serviceNav">
      <button type="button" data-service="all" class="active">すべて</button>
      <button type="button" data-service="netflix">Netflix</button>
      <button type="button" data-service="prime" class="prime">Amazon</button>
      <button type="button" data-service="psplus" class="ps">PS Plus</button>
    </nav>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="タイトルで検索（関係ないものは極力出ません）">

    <div class="filter-row">
      <span class="filter-label">状態：</span>
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="new">新着</button>
      <button class="filter-btn" data-filter="leaving">配信終了間近</button>
    </div>

    <div class="genre-curtain">
      <button type="button" class="genre-toggle" id="genreToggle">
        <span>ジャンル・機種</span>
        <span id="genreArrow">▼</span>
      </button>
      <div class="genre-body" id="genreBody">
        <!-- JSで生成 -->
      </div>
    </div>

    <div class="sort-row">
      <span class="filter-label">並べ替え：</span>
      <select class="sort-select" id="sortSelect">
        <option value="added_desc">登録順（新しい順）</option>
        <option value="added_asc">登録順（古い順）</option>
        <option value="year_desc">上映年（新しい順）</option>
        <option value="year_asc">上映年（古い順）</option>
        <option value="title">タイトル名</option>
      </select>
    </div>

    <div class="status-line" id="statusLine">読み込み中...</div>
  </div>

  <main class="grid-section" id="mainArea">
    <!-- JS -->
  </main>

  <footer class="shop-footer">
    netamapsn — Netflix / Amazon / PS Plus を探しやすく
  </footer>

  <script>
    const PER_PAGE = 50;
    let allData = null;
    let currentService = 'all';
    let currentFilter = 'all';
    let currentGenre = null;
    let currentPlatform = null;
    let currentSort = 'added_desc';
    let searchQuery = '';
    let currentPage = 1;

    async function loadData() {
      try {
        const res = await fetch('data/titles.json?t=' + Date.now());
        allData = await res.json();
        buildGenreButtons();
        render();
      } catch (e) {
        document.getElementById('statusLine').textContent = 'データ読み込みに失敗しました';
        console.error(e);
      }
    }

    function buildGenreButtons() {
      const body = document.getElementById('genreBody');
      body.innerHTML = '';
      const genreSet = new Set();
      const platformSet = new Set();
      Object.values(allData.services).forEach(svc => {
        (svc.genres || []).forEach(g => genreSet.add(g));
        (svc.platforms || []).forEach(p => platformSet.add(p));
        (svc.titles || []).forEach(t => {
          (t.genres || []).forEach(g => genreSet.add(g));
          (t.platforms || []).forEach(p => platformSet.add(p));
        });
      });

      [...platformSet].sort().forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn platform';
        btn.dataset.platform = p;
        btn.textContent = p;
        btn.onclick = () => {
          if (btn.classList.contains('active')) {
            btn.classList.remove('active');
            currentPlatform = null;
          } else {
            body.querySelectorAll('[data-platform]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPlatform = p;
          }
          currentPage = 1;
          render();
        };
        body.appendChild(btn);
      });

      [...genreSet].sort().forEach(g => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.genre = g;
        btn.textContent = g;
        btn.onclick = () => {
          if (btn.classList.contains('active')) {
            btn.classList.remove('active');
            currentGenre = null;
          } else {
            body.querySelectorAll('[data-genre]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentGenre = g;
          }
          currentPage = 1;
          render();
        };
        body.appendChild(btn);
      });
    }

    function isNew(t) {
      if (!t.added_date) return false;
      const diff = (new Date() - new Date(t.added_date)) / 86400000;
      return diff <= 14;
    }
    function isLeaving(t) {
      if (!t.leaving_date) return false;
      const diff = (new Date(t.leaving_date) - new Date()) / 86400000;
      return diff >= 0 && diff <= 14;
    }
    function daysLeft(t) {
      if (!t.leaving_date) return null;
      return Math.ceil((new Date(t.leaving_date) - new Date()) / 86400000);
    }

    function getAllFiltered() {
      let list = [];
      const services = currentService === 'all'
        ? Object.keys(allData.services)
        : [currentService];

      services.forEach(key => {
        const svc = allData.services[key];
        if (!svc) return;
        (svc.titles || []).forEach(t => {
          list.push({ ...t, _service: key });
        });
      });

      if (searchQuery) {
        const q = searchQuery.toLowerCase().trim();
        list = list.filter(t =>
          (t.title || '').toLowerCase().includes(q) ||
          (t.original_title || '').toLowerCase().includes(q)
        );
      }
      if (currentFilter === 'new') list = list.filter(isNew);
      if (currentFilter === 'leaving') list = list.filter(isLeaving);
      if (currentGenre) list = list.filter(t => (t.genres || []).includes(currentGenre));
      if (currentPlatform) list = list.filter(t => (t.platforms || []).includes(currentPlatform));

      list.sort((a, b) => {
        if (currentSort === 'added_desc') return (b.added_date || '').localeCompare(a.added_date || '');
        if (currentSort === 'added_asc') return (a.added_date || '').localeCompare(b.added_date || '');
        if (currentSort === 'year_desc') return (b.year || 0) - (a.year || 0);
        if (currentSort === 'year_asc') return (a.year || 0) - (b.year || 0);
        if (currentSort === 'title') return (a.title || '').localeCompare(b.title || '', 'ja');
        return 0;
      });
      return list;
    }

    function posterUrl(t) {
      let p = t.poster || '';
      if (!p) return '';
      return p.replace('{profile}', 's166').replace('{format}', 'jpg');
    }

    function createCard(t) {
      const div = document.createElement('div');
      div.className = 'card';
      div.onclick = () => { if (t.link) window.open(t.link, '_blank'); };

      let badge = '';
      if (isNew(t)) badge = '<div class="badge new">NEW</div>';
      else if (isLeaving(t)) badge = '<div class="badge leaving">あと' + daysLeft(t) + '日</div>';

      const poster = posterUrl(t);
      const style = poster ? 'background-image:url(\'' + poster + '\')' : '';

      let tags = '';
      (t.platforms || []).forEach(p => { tags += '<span class="platform">' + p + '</span>'; });
      (t.genres || []).slice(0, 2).forEach(g => { tags += '<span>' + g + '</span>'; });

      div.innerHTML =
        '<div class="card-poster" style="' + style + '">' + badge + '</div>' +
        '<div class="card-info">' +
          '<div class="card-title">' + escapeHtml(t.title) + '</div>' +
          '<div class="card-tags">' + tags + '</div>' +
        '</div>';
      return div;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function render() {
      if (!allData) return;
      const list = getAllFiltered();
      const total = list.length;
      const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * PER_PAGE;
      const pageItems = list.slice(start, start + PER_PAGE);

      const main = document.getElementById('mainArea');
      let titleText = 'すべて';
      if (currentService === 'netflix') titleText = 'Netflix';
      if (currentService === 'prime') titleText = 'Amazonプライム';
      if (currentService === 'psplus') titleText = 'PS Plus';

      let html = '<div class="section-title">' + titleText +
        ' <span class="count">' + total + '件</span></div>';

      if (pageItems.length === 0) {
        html += '<div class="empty-msg">該当するタイトルがありません</div>';
      } else {
        html += '<div class="title-grid" id="grid"></div>';
        html += '<div class="pagination">' +
          '<button id="prevBtn"' + (currentPage <= 1 ? ' disabled' : '') + '>← 前へ</button>' +
          '<span class="page-info">' + currentPage + ' / ' + totalPages + ' ページ</span>' +
          '<button id="nextBtn"' + (currentPage >= totalPages ? ' disabled' : '') + '>次へ →</button>' +
          '</div>';
      }
      main.innerHTML = html;

      const grid = document.getElementById('grid');
      if (grid) {
        pageItems.forEach(t => grid.appendChild(createCard(t)));
      }

      const prev = document.getElementById('prevBtn');
      const next = document.getElementById('nextBtn');
      if (prev) prev.onclick = () => { currentPage--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      if (next) next.onclick = () => { currentPage++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };

      let status = '表示中：' + total + '件';
      if (searchQuery) status += ' ／ 検索「' + searchQuery + '」';
      if (currentGenre) status += ' ／ ジャンル「' + currentGenre + '」';
      if (currentPlatform) status += ' ／ 機種「' + currentPlatform + '」';
      if (currentFilter !== 'all') status += ' ／ ' + (currentFilter === 'new' ? '新着' : '終了間近');
      status += ' ／ 更新: ' + (allData.updated_at || '-');
      document.getElementById('statusLine').textContent = status;
    }

    // Events
    document.getElementById('searchInput').addEventListener('input', e => {
      searchQuery = e.target.value;
      currentPage = 1;
      render();
    });

    document.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        currentPage = 1;
        render();
      });
    });

    document.getElementById('sortSelect').addEventListener('change', e => {
      currentSort = e.target.value;
      currentPage = 1;
      render();
    });

    document.getElementById('serviceNav').addEventListener('click', e => {
      const btn = e.target.closest('[data-service]');
      if (!btn) return;
      document.querySelectorAll('#serviceNav [data-service]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentService = btn.dataset.service;
      currentPage = 1;
      render();
    });

    document.getElementById('genreToggle').addEventListener('click', () => {
      const body = document.getElementById('genreBody');
      const arrow = document.getElementById('genreArrow');
      body.classList.toggle('open');
      arrow.textContent = body.classList.contains('open') ? '▲' : '▼';
    });

    document.getElementById('homeBtn').addEventListener('click', e => {
      e.preventDefault();
      currentService = 'all';
      currentFilter = 'all';
      currentGenre = null;
      currentPlatform = null;
      searchQuery = '';
      currentPage = 1;
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('[data-filter]').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
      document.querySelectorAll('#serviceNav [data-service]').forEach(b => b.classList.toggle('active', b.dataset.service === 'all'));
      document.querySelectorAll('#genreBody .filter-btn').forEach(b => b.classList.remove('active'));
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    loadData();
  </script>
</body>
</html>
